# ADINN Planning Task Manager: frontend (nginx + SPA) -> backend (Express) -> external MongoDB.

name: adinn-planning

services:

  backend:
    build:
      context: ./backend
    image: adinn-planning-backend:latest
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5001"
      UPLOAD_DIR: /app/uploads

    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-3001}:5001"

    volumes:
      - backend_uploads:/app/uploads

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - app
      - mongodb_default


  frontend:
    build:
      context: ./frontend

    image: adinn-planning-frontend:latest

    restart: unless-stopped

    environment:
      BACKEND_UPSTREAM: http://backend:5001
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-300m}

    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app


networks:

  app:
    driver: bridge

  mongodb_default:
    external: true
    name: mongodb_default


volumes:

  backend_uploads:
